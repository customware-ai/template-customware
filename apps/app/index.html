<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App</title>
    <style>
      @keyframes initial-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .initial-loading {
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.9rem;
        padding: 1rem;
        background: #fff;
        color: #52525b;
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.875rem;
      }

      .initial-loading__spinner {
        width: 2rem;
        height: 2rem;
        border: 2px solid #e4e4e7;
        border-top-color: #52525b;
        border-radius: 999px;
        animation: initial-loading-spin 0.8s linear infinite;
      }

      .dark .initial-loading {
        background: #18181b;
        color: #d4d4d8;
      }

      .dark .initial-loading__spinner {
        border-color: #3f3f46;
        border-top-color: #d4d4d8;
      }

      @media (prefers-reduced-motion: reduce) {
        .initial-loading__spinner {
          animation: none;
        }
      }
    </style>
    <script>
      (function () {
        var storageKey = "ui-theme";
        var mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

        function getThemeMode() {
          try {
            var storedThemeMode = window.localStorage.getItem(storageKey);
            if (
              storedThemeMode === "dark" ||
              storedThemeMode === "light" ||
              storedThemeMode === "system"
            ) {
              return storedThemeMode;
            }
          } catch (error) {
            // Ignore malformed localStorage payloads and fall back to system theme.
          }

          return "system";
        }

        function applyThemeMode(themeMode) {
          var resolvedThemeMode =
            themeMode === "system" ? (mediaQuery.matches ? "dark" : "light") : themeMode;
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(resolvedThemeMode);
        }

        applyThemeMode(getThemeMode());

        mediaQuery.addEventListener("change", function () {
          applyThemeMode(getThemeMode());
        });

        window.addEventListener("storage", function (event) {
          if (event.key === storageKey) {
            applyThemeMode(getThemeMode());
          }
        });
      })();
    </script>
  </head>
  <body class="overflow-x-hidden bg-background text-foreground antialiased">
    <div id="root">
      <output aria-live="polite" class="initial-loading" data-slot="hydrate-loader"
        ><span aria-hidden="true" class="initial-loading__spinner"></span
        ><span>Loading application</span></output
      >
    </div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
